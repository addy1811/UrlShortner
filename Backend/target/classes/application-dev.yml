spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/shortnerDB
    username: ${DB_USERNAME:urlShortner}
    password: ${DB_PASSWORD:kjsaio3ncxw2mkf9mclsj3n1492sk}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # NEVER 'update' or 'create' — Flyway owns the schema, Hibernate only validates
      # it matches what the entities expect. Catches entity/migration drift early.
      ddl-auto: validate
    show-sql: true

logging:
  level:
    com.adi.urlshortener: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG

# Relaxed CORS for local frontend dev (e.g. Vite on 5173)
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000