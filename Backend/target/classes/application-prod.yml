spring:
  datasource:
    url: ${DB_URL}              # e.g. jdbc:postgresql://prod-host:5432/url_shortener
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.adi.urlshortener: INFO

server:
  error:
    include-message: never       # don't leak internals in prod error responses
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}   # comma-separated, e.g. https://yourapp.com

# app.jwt.secret and app.encryption.secret-key are inherited from application.yml's
# ${JWT_SECRET} / ${ENCRYPTION_SECRET_KEY} placeholders — set these as real env vars
# (32+ random bytes, base64-encoded) in your prod environment. Never reuse the dev defaults.